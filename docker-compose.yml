services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: meddevices
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d meddevices"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    environment:
      ADDR: ":8080"
      API_KEY: "dev-api-key"
      DATABASE_URL: "postgres://postgres:postgres@postgres:5432/meddevices?sslmode=disable"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
